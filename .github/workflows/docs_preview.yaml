name: Preview documentation

on:
  workflow_run:
    workflows:
      - Build documentation
      - Rebuild documentation
    types:
      - completed

permissions: {}

concurrency:
  group: preview-documentation-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate preview artifacts
    if: |
      github.event.workflow_run.path == '.github/workflows/docs_build.yaml' &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
    steps:
      - name: Validate source run and artifact inventory
        id: inventory
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              },
            );

            const requireArtifact = (name, maximumSize) => {
              const matches = artifacts.filter((artifact) =>
                artifact.name === name && !artifact.expired);
              if (matches.length !== 1) {
                throw new Error(
                  `Expected exactly one non-expired ${name} artifact; found ${matches.length}.`,
                );
              }
              if (matches[0].size_in_bytes > maximumSize) {
                throw new Error(`${name} exceeds the allowed compressed size.`);
              }
              return matches[0];
            };

            const metadata = requireArtifact('preview-metadata', 64 * 1024);
            core.setOutput('metadata-id', String(metadata.id));

            const inputs = requireArtifact('inputs', 64 * 1024);
            core.setOutput('inputs-id', String(inputs.id));

            const buildLog = requireArtifact('build-log-html', 32 * 1024 * 1024);
            core.setOutput('build-log-id', String(buildLog.id));

            if (run.conclusion === 'success') {
              const build = requireArtifact('build-output-md', 512 * 1024 * 1024);
              core.setOutput('build-id', String(build.id));
            }

      - name: Download preview metadata
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ steps.inventory.outputs.metadata-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: preview-metadata

      - name: Download publisher inputs
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ steps.inventory.outputs.inputs-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: inputs

      - name: Validate preview metadata
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const run = context.payload.workflow_run;

            const readValue = (directory, name, pattern) => {
              const file = path.join(directory, name);
              const raw = fs.readFileSync(file, 'utf8');
              const value = raw.endsWith('\n') ? raw.slice(0, -1) : raw;
              if (value.includes('\n') || value.includes('\r') || !pattern.test(value)) {
                throw new Error(`Invalid ${name} value.`);
              }
              return value;
            };

            const pullNumberText = readValue(
              'preview-metadata',
              'pr-number',
              /^[1-9][0-9]*$/,
            );
            const headSha = readValue(
              'preview-metadata',
              'head-sha',
              /^[0-9a-f]{40}$/,
            );
            const revision = readValue(
              'preview-metadata',
              'revision',
              /^pr-[1-9][0-9]*-[0-9a-f]{40}$/,
            );
            const event = readValue(
              'preview-metadata',
              'event',
              /^(pull_request|workflow_dispatch)$/,
            );
            const publisherPullNumber = readValue(
              'inputs',
              'pr-number',
              /^[1-9][0-9]*$/,
            );
            const publisherRevision = readValue(
              'inputs',
              'revision',
              /^pr-[1-9][0-9]*-[0-9a-f]{40}$/,
            );
            const pullNumber = Number(pullNumberText);

            if (event !== run.event) {
              throw new Error('The metadata event does not match the source run.');
            }
            if (revision !== `pr-${pullNumber}-${headSha}`) {
              throw new Error('The revision does not match the pull request and SHA.');
            }
            if (
              publisherPullNumber !== pullNumberText ||
              publisherRevision !== revision
            ) {
              throw new Error('The publisher inputs do not match the validated metadata.');
            }
            if (run.event === 'pull_request') {
              const linked = run.pull_requests?.some(
                (pull) => pull.number === pullNumber,
              );
              if (!linked || run.head_sha !== headSha) {
                throw new Error('The source run does not match the pull request metadata.');
              }
            }

            const {data: pull} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            if (pull.state !== 'open' || pull.head.sha !== headSha) {
              throw new Error('The pull request is closed or has moved to a newer SHA.');
            }

      - name: Download build log
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ steps.inventory.outputs.build-log-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: build-log

      - name: Validate publisher inputs and build log
        shell: bash
        run: |
          set -euo pipefail

          for file in inputs/pr-number inputs/revision build-log/build-html.log; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required artifact file is missing: $file"
              exit 1
            fi
          done

          if find inputs build-log -mindepth 1 \
              ! -type f ! -type d -print -quit | grep -q .; then
            echo "::error::A supporting artifact contains a non-regular file."
            exit 1
          fi

      - name: Download build output
        if: github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ steps.inventory.outputs.build-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: build-output-md

      - name: Validate build output
        if: github.event.workflow_run.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d build-output-md ]]; then
            echo "::error::The build output directory is missing."
            exit 1
          fi

          if find build-output-md -mindepth 1 \
              ! -type f ! -type d -print -quit | grep -q .; then
            echo "::error::The build output contains a non-regular file."
            exit 1
          fi

          while IFS= read -r -d '' path; do
            if [[ "$path" == *$'\n'* || "$path" == *$'\r'* ]]; then
              echo "::error::The build output contains an invalid path."
              exit 1
            fi
          done < <(find build-output-md -mindepth 1 -print0)

          file_count=$(find build-output-md -type f -printf '.' | wc -c)
          byte_count=$(du -sb build-output-md | cut -f1)
          if (( file_count > 250000 )); then
            echo "::error::The build output contains too many files."
            exit 1
          fi
          if (( byte_count > 4294967296 )); then
            echo "::error::The extracted build output exceeds 4 GiB."
            exit 1
          fi

  upload:
    name: Upload preview
    needs: validate
    if: |
      needs.validate.result == 'success' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      # The source-run artifacts are immutable and were checked by validate.
      # Keep the existing uploader and all of its inputs unchanged.
      - name: Upload
        uses: diplodoc-platform/docs-upload-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          storage-endpoint: ${{ vars.DOCS_AWS_ENDPOINT }}
          storage-region: ${{ vars.DOCS_AWS_REGION }}
          storage-bucket: ${{ vars.DIPLODOC_STORAGE_BUCKET }}
          storage-access-key-id: ${{ secrets.DOCS_AWS_KEY_ID }}
          storage-secret-access-key: ${{ secrets.DOCS_AWS_SECRET_ACCESS_KEY }}
          cli-version: stable

  comment:
    name: Comment on pull request
    needs:
      - validate
      - upload
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (github.event.workflow_run.conclusion != 'success' ||
       needs.upload.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      # Keep the existing comment body, log summary, and preview link behavior.
      - name: Comment message
        uses: diplodoc-platform/docs-message-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          project-link: ${{ vars.DIPLODOC_PROJECT_LINK }}
